# pytest.ini
[pytest]
# Only collect this project's tests. Without this, pytest also sweeps the
# vendored legacy FAIRsoft/ tree in the working directory, whose tests import a
# `FAIRsoft` package that isn't installed here.
testpaths = tests

# Repo root on sys.path so shared fixtures/data import as `tests.<...>`.
# (`src` is already importable via `pip install -e .`)
pythonpath = .

addopts = -m "not manual"
markers =
    manual: marks tests that should only run when manually triggered
asyncio_mode = auto
env_files =
    .env